<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Small-Cap Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <span class="brand">Small-Cap Tracker</span>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Features" hidden></nav>
  </div>

  <header>
    <span class="eyebrow" id="eyebrow"></span>
    <h1 id="heading">Small-Cap Tracker</h1>
    <p class="lede" id="lede"></p>
  </header>

  <div class="day">
    <button type="button" id="prev" aria-label="Earlier day">‹</button>
    <label for="date">Day</label>
    <select id="date"></select>
    <button type="button" id="next" aria-label="Later day">›</button>
    <span id="compare"></span>
  </div>

  <main class="view" id="view"></main>

  <footer>
    <span id="source"></span>
    <span>Ticker links open the quote on Yahoo Finance. Nothing here is a recommendation to buy anything.</span>
  </footer>
</div>

<!-- Data first, then the shell, then one script per view. -->
<script src="data/all.js"></script>
<script src="app.js"></script>
<script src="views/ranked-list.js"></script>
</body>
</html>
